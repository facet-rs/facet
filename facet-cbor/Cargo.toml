[package]
name = "facet-cbor"
version = "0.50.0-rc.5"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "CBOR (RFC 8949) binary format for facet"
keywords = ["cbor", "binary", "serialization", "facet"]
categories = ["encoding", "parsing"]
homepage = "https://facet.rs"

[package.metadata]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[dependencies]
facet-core = { workspace = true }
facet-format = { path = "../facet-format", version = "0.50.0-rc.5" }
facet-reflect = { workspace = true }

# Axum integration (optional)
axum-core = { version = "0.5", default-features = false, optional = true }
http = { workspace = true, optional = true }
http-body-util = { version = "0.1", default-features = false, optional = true }

[dev-dependencies]
facet = { path = "../facet", features = ["std", "all-impls", "iddqd"] }
ciborium = "0.2"
serde = { workspace = true, features = ["derive"] }

[features]
default = []
std = []
net = ["facet-format/net", "facet-core/net"]
iddqd = ["facet-core/iddqd"]

# Axum HTTP integration
axum = ["std", "dep:axum-core", "dep:http", "dep:http-body-util"]

# yoke support
yoke = ["facet-core/yoke"]

[lints]
workspace = true
