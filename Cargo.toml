# Allow the facet_no_doc cfg in generated code
# See: https://doc.rust-lang.org/nightly/rustc/check-cfg/cargo-specifics.html
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(facet_no_doc)", "cfg(kani)"] }

[workspace.lints.clippy]
# Box::leak is always a bug in this codebase - it hides lifetime problems instead of solving them
disallowed_methods = "deny"

# Profiling profile - release optimizations with line tables for callgrind/perf
[profile.profiling]
inherits = "release"
debug = "line-tables-only"

# Fuzzing profile for cargo-bolero
[profile.fuzz]
inherits = "dev"
opt-level = 3
incremental = false
codegen-units = 1

[profile.dev.package.backtrace]
opt-level = 3

# Keep workspace crates in debug mode, but optimize dependency hot paths that
# dominate vix's debug test runtime.
[profile.dev.package.aho-corasick]
opt-level = 3

# The machine itself: measured 6.8x on solve-heavy tests (ring 64: 20.3s -> 3.0s
# fully optimized). opt-level 2 trades a little rebuild time for most of that.

[profile.dev.package.weavy]
opt-level = 2

[profile.dev.package.blake3]
opt-level = 3

[profile.dev.package.block-buffer]
opt-level = 3

[profile.dev.package.cpufeatures]
opt-level = 3

[profile.dev.package.crypto-common]
opt-level = 3

[profile.dev.package.digest]
opt-level = 3

[profile.dev.package.generic-array]
opt-level = 3

[profile.dev.package.hashbrown]
opt-level = 3

[profile.dev.package.memchr]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.regex]
opt-level = 3

[profile.dev.package.regex-automata]
opt-level = 3

[profile.dev.package.regex-syntax]
opt-level = 3


