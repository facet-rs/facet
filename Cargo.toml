[workspace]
members = [
  "facet-core",
  "facet",
  "facet-macros-impl",
  "facet-macros",
  "facet-macro-types",
  "facet-macro-parse",
  "facet-error",
  "facet-default",
  "facet-reflect",
  "facet-solver",
  "facet-testhelpers",
  "facet-testhelpers-macros",
  "facet-testattrs",
  "facet-pretty",
  "facet-path",
  "facet-validate",
  "facet-showcase",
]

# Keep root-level cargo commands focused on the Facet surface. Use `--workspace`
# for every crate in the repository.
default-members = [
  # core
  "facet-core",
  "facet",
]


resolver = "3"

[workspace.package]
version = "0.50.0-rc.5"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/facet-rs/facet"
homepage = "https://facet.rs"
documentation = "https://docs.rs/facet"
keywords = ["reflection", "serialization", "deserialization"]
categories = ["encoding", "development-tools"]

[workspace.dependencies]
facet = { path = "facet", version = "0.50.0-rc.7" }
facet-core = { path = "facet-core", version = "0.50.0-rc.7" }
facet-default = { path = "facet-default", version = "0.50.0-rc.7" }
facet-path = { path = "facet-path", version = "0.50.0-rc.7" }
facet-pretty = { path = "facet-pretty", version = "0.50.0-rc.7" }
facet-reflect = { path = "facet-reflect", version = "0.50.0-rc.7" }
facet-solver = { path = "facet-solver", version = "0.50.0-rc.7" }
facet-testhelpers = { path = "facet-testhelpers", version = "0.50.0-rc.7" }
taxon = "0.2.0-rc.5"
cstree = { version = "0.14.0", features = ["derive"] }
arborium = { version = "^2.4.5", default-features = false, features = [
  "lang-json",
  "lang-rust",
] }
arborium-highlight = "^2.4.5"
arborium-theme = "^2.4.5"
aho-corasick = "1.1.4"
autocfg = "^1.5.0"
axum = { version = "0.8.9", default-features = false, features = [
  "http1",
  "tokio",
  "json",
  "ws",
] }
ariadne = "^0.6"
blake3 = { version = "^1", default-features = false }
bolero = "^0.13.4"
brotli = "8"
bytes = { version = "^1.11.0", default-features = false }
bstr = { version = "^1.12.3", default-features = false, features = ["alloc"] }
bytestring = { version = "^1.4.0", default-features = false }
cbindgen = "^0.28"
cc = "^1.0.87"
camino = "^1.2.1"
compact_str = { version = "^0.9.0", default-features = false }
chrono = { version = "^0.4.42", default-features = false, features = ["alloc"] }
codegen = "^0.3"
crossterm = "^0.29"
datatest-stable = "0.3"
dashmap = "^6"
deadpool-postgres = "^0.14"
dirs = "^6"
divan = { package = "codspeed-divan-compat", version = "4.7.0" }
dotenvy = "^0.15"
eyre = "^0.6.12"
futures = "^0.3"
futures-channel = "0.3"
futures-util = { version = "^0.3.31", default-features = false, features = [
  "std",
  "async-await",
  "async-await-macro",
] }
glob = "^0.3"
goblin = "^0.9"
hashbrown = { version = "0.17", features = ["raw-entry"] }
heck = "^0.5.0"
hex = "^0.4"
http = "^1.4.0"
im = "^15.1.0"
indexmap = { version = "^2.12.1", default-features = false }
insta = "^1.44.3"
inventory = "^0.3"
iroh = "1.0.2"
jiff = "^0.2.16"
js-sys = "0.3"
libc = "0.2.180"
