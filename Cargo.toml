[workspace]
members = [
  "facet-core",
  "facet",
  "facet-macros-impl",
  "facet-macros",
  "facet-macro-types",
  "facet-macro-parse",
  "facet-error",
  "facet-default",
  "facet-reflect",
  "facet-solver",
  "facet-testhelpers",
  "facet-testhelpers-macros",
  "facet-testattrs",
  "facet-pretty",
  "facet-urlencoded",
  "facet-axum",
  "facet-dessert",
  "facet-format",
  "facet-json",
  "facet-json-classics",
  "facet-postcard",
  "facet-msgpack",
  "facet-toml",
  "facet-yaml",
  "facet-format-suite",
  "facet-asn1",
  "facet-csv",
  "facet-xdr",
  "facet-json-schema",
  "facet-typescript",
  "facet-python",
  "facet-lua",
  "facet-value",
  "facet-zod",
  "facet-singularize",
  "facet-dom",
  "facet-xml",
  "facet-xml-node",
  "facet-atom",
  "facet-svg",
  "facet-path",
  "facet-validate",
  "facet-hash",
  "facet-cargo-toml",
  "rusqlite-facet",
  "rediff",
  "strid",
  "strid-macros",
  "strid-examples",
  "facet-lsp",
  "facet-showcase",
]

# Keep root-level cargo commands focused on the Facet surface and the active
# Weavy/Phon extraction work. Use `--workspace` for full monorepo checks.
default-members = [
  # core
  "facet-core",
  "facet",
]

exclude = [
  # tools/ has its own workspace
  "tools",

  # imported Vox directories that were not members of the original Vox workspace
  "vox/fuzz",
]

resolver = "3"

[workspace.package]
version = "0.10.0-rc.1"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/facet-rs/facet"
homepage = "https://facet.rs"
documentation = "https://docs.rs/vox"
keywords = ["rpc", "ipc", "networking", "facet"]
categories = ["network-programming", "asynchronous"]

[workspace.dependencies]
facet = { path = "facet", version = "0.50.0-rc.5" }
