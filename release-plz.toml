version_group = "facet"
changelog_path = "CHANGELOG.md"

[[package]]
name = "facet-macro-types"
version_group = "facet"
changelog_path = "CHANGELOG.md"

[[package]]
name = "facet-macro-parse"
version_group = "facet"
changelog_path = "CHANGELOG.md"

[[package]]
name = "facet-reflect"
version_group = "facet"
changelog_path = "CHANGELOG.md"

[[package]]
name = "facet-error"
version_group = "facet"
changelog_path = "CHANGELOG.md"

[[package]]
name = "facet-default"
version_group = "facet"
changelog_path = "CHANGELOG.md"

[[package]]
