[workspace]
changelog_update = true
semver_check = true
dependencies_update = true
git_release_enable = true

# Crates that expose Facet types share one release line. A facet-core API change
# must not leave consumers with incompatible versions across public boundaries.
[[package]]
name = "facet-core"
version_group = "facet"
changelog_path = "CHANGELOG.md"

[[package]]
name = "facet"
version_group = "facet"
changelog_path = "CHANGELOG.md"

[[package]]
