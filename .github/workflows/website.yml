# Build and deploy website to GitHub Pages
name: Website

on:
  push:
    branches: [main]
    paths:
      - '.config/dodeca.styx'          # source set / mounts / link-check config
      - 'docs/**'                       # primary Facet content, templates, sass, and static assets
      - '*/docs/**'                     # remaining crate subsites
      - '*/README.md'                   # crate READMEs embedded via the include shortcode
      - '.github/workflows/website.yml'
      - 'facet-showcase/**'
      - 'facet-*/examples/*showcase*.rs'
  pull_request:
    branches: [main]
    paths:
      - '.config/dodeca.styx'
      - 'docs/**'
      - '*/docs/**'
      - '*/README.md'
      - '.github/workflows/website.yml'
      - 'facet-showcase/**'
      - 'facet-*/examples/*showcase*.rs'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build website with dodeca
        run: |
          tmp="${RUNNER_TEMP}/dodeca-package"
          rm -rf "$tmp"
          mkdir -p "$tmp"
          curl --proto '=https' --tlsv1.2 -fsSL \
            https://github.com/bearcove/dodeca/releases/latest/download/dodeca-x86_64-unknown-linux-gnu.tar.xz \
            | tar -xJ -C "$tmp"
          "$tmp/ddc" --version
          "$tmp/ddc" build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/public

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
