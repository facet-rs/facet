# HANDWRITTEN: facet-dev hands off my pipelines

name: Tests / Linux

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: Workspace (${{ matrix.partition }})
    runs-on: bearcove-ubuntu-24.04
    container:
      image: ghcr.io/facet-rs/facet-ci:latest-amd64
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        partition: ["1/3", "2/3", "3/3"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Select Rust 1.92
        shell: bash
        run: |
          rustup toolchain install 1.92 --profile minimal --component rust-src --component clippy --component llvm-tools-preview --component rustfmt
          rustup target add thumbv8m.main-none-eabihf --toolchain 1.92
          echo "RUSTUP_TOOLCHAIN=1.92" >> "$GITHUB_ENV"
      - name: Install system dependencies
        run: apt-get update && apt-get install -y zlib1g-dev
      - uses: Swatinem/rust-cache@v2
      - name: Run workspace tests
        shell: bash
        env:
          PROPTEST_CASES: 0
        run: >-
          cargo nextest run --workspace --features ci --no-fail-fast
          --partition hash:${{ matrix.partition }}
          -E 'all()'

  quality:
    name: Clippy, docs, and lockfile
    runs-on: bearcove-ubuntu-24.04
    container:
      image: ghcr.io/facet-rs/facet-ci:latest-amd64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Select Rust 1.92
        shell: bash
        run: |
          rustup toolchain install 1.92 --profile minimal --component rust-src --component clippy --component llvm-tools-preview --component rustfmt
          rustup target add thumbv8m.main-none-eabihf --toolchain 1.92
          echo "RUSTUP_TOOLCHAIN=1.92" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - name: Check lockfile
        run: cargo update --workspace --locked
      - name: Run Clippy
        run: cargo clippy --workspace --all-features --all-targets --keep-going -- -D warnings --allow deprecated
      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: just docs

  semver-checks:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: bearcove-ubuntu-24.04
    permissions:
      contents: read
    env:
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_HTTP_TIMEOUT: "120"
      CARGO_NET_RETRY: "10"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Run cargo-semver-checks
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          manifest-path: Cargo.toml
          baseline-rev: origin/main
          exclude: facet-testattrs, facet-cargo-toml, facet-axum, rusqlite-facet, rediff, facet-dessert, facet-format, facet-json, facet-json-classics, facet-postcard, facet-msgpack, facet-toml, facet-yaml, facet-format-suite, facet-asn1, facet-csv, facet-xdr, facet-json-schema, facet-typescript, facet-python, facet-lua, facet-value, facet-hash, facet-zod, facet-singularize, facet-dom, facet-xml, facet-xml-node, facet-atom, facet-svg
          verbose: true
