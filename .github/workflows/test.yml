# HANDWRITTEN: facet-dev hands off my pipelines

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: Linux x86_64
    runs-on: blacksmith-4vcpu-ubuntu-2404
    container:
      image: ghcr.io/facet-rs/facet-ci:latest-amd64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Select Rust 1.92
        shell: bash
        run: |
          rustup toolchain install 1.92 --profile minimal --component rust-src --component clippy --component llvm-tools-preview --component rustfmt
          rustup target add thumbv8m.main-none-eabihf --toolchain 1.92
          echo "RUSTUP_TOOLCHAIN=1.92" >> "$GITHUB_ENV"
      - name: Install system dependencies
        run: apt-get update && apt-get install -y zlib1g-dev
      - uses: Swatinem/rust-cache@v2
      - name: Run workspace tests
        shell: bash
        env:
          PROPTEST_CASES: 0
        run: cargo nextest run --workspace --features ci --no-fail-fast

  quality:
    name: Clippy, docs, and lockfile
    runs-on: blacksmith-2vcpu-ubuntu-2404
    container:
      image: ghcr.io/facet-rs/facet-ci:latest-amd64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Select Rust 1.92
        shell: bash
        run: |
          rustup toolchain install 1.92 --profile minimal --component rust-src --component clippy --component llvm-tools-preview --component rustfmt
          rustup target add thumbv8m.main-none-eabihf --toolchain 1.92
          echo "RUSTUP_TOOLCHAIN=1.92" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - name: Check lockfile
        run: cargo update --workspace --locked
      - name: Run Clippy
        run: cargo clippy --workspace --all-features --all-targets --keep-going -- -D warnings --allow deprecated
      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: just docs

  semver-checks:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
    env:
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_HTTP_TIMEOUT: "120"
      CARGO_NET_RETRY: "10"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Run cargo-semver-checks
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          manifest-path: Cargo.toml
          baseline-rev: origin/main
          exclude: facet-testattrs, facet-showcase
          verbose: true
  macos:
    name: macOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "false"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Run macOS tests
        env:
          PROPTEST_CASES: 0
        run: cargo nextest run --features ci --workspace --no-fail-fast

  linux-arm64:
    name: Linux ARM64 (advisory)
    continue-on-error: true
    runs-on: ubuntu-24.04-arm
    container:
      image: ghcr.io/facet-rs/facet-ci:latest-arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Select Rust 1.92
        shell: bash
        run: |
          rustup toolchain install 1.92 --profile minimal --component rust-src --component clippy --component llvm-tools-preview --component rustfmt
          rustup target add thumbv8m.main-none-eabihf --toolchain 1.92
          echo "RUSTUP_TOOLCHAIN=1.92" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - name: Run Linux ARM64 tests
        env:
          PROPTEST_CASES: 0
        run: cargo nextest run --features ci --workspace --no-fail-fast

  windows:
    name: Windows (advisory)
    continue-on-error: true
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Run Windows tests
        shell: bash
        env:
          PROPTEST_CASES: 0
        run: cargo nextest run --features ci --workspace --no-fail-fast
  nostd:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    container:
      image: ghcr.io/facet-rs/facet-ci:latest-amd64
    steps:
      - uses: actions/checkout@v7
      - name: Select Rust 1.92
        shell: bash
        run: |
          rustup toolchain install 1.92 --profile minimal --component rust-src --component clippy --component llvm-tools-preview --component rustfmt
          rustup target add thumbv8m.main-none-eabihf --toolchain 1.92
          echo "RUSTUP_TOOLCHAIN=1.92" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - name: Run no-std checks
        run: just nostd-ci

  miri:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    name: Miri
    container:
      image: ghcr.io/facet-rs/facet-ci:latest-miri-amd64
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Run targeted Miri suite
        env:
          CI: "true"
        run: just miri

  nightly:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    container:
      image: ghcr.io/facet-rs/facet-ci:latest-miri-amd64
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Run nightly feature tests
        env:
          PROPTEST_CASES: 0
        run: cargo nextest run --package facet-core --features facet-core/simd,facet-core/bytes

  msrv:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    container:
      image: ghcr.io/facet-rs/facet-ci:latest-amd64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Select Rust 1.92
        shell: bash
        run: |
          rustup toolchain install 1.92 --profile minimal --component rust-src --component clippy --component llvm-tools-preview --component rustfmt
          rustup target add thumbv8m.main-none-eabihf --toolchain 1.92
          echo "RUSTUP_TOOLCHAIN=1.92" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - name: Check MSRV
        run: just msrv

  coverage:
    if: github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: blacksmith-2vcpu-ubuntu-2404
    container:
      image: ghcr.io/facet-rs/facet-ci:latest-amd64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Select nightly with coverage tools
        shell: bash
        run: rustup toolchain install nightly --profile minimal --component llvm-tools-preview --component rustfmt
      - name: Install system dependencies
        run: apt-get update && apt-get install -y zlib1g-dev
      - uses: Swatinem/rust-cache@v2
      - name: Run coverage suite
        env:
          PROPTEST_CASES: 0
        run: |
          cargo +nightly llvm-cov --no-report nextest --workspace --features ci --no-fail-fast
          cargo +nightly llvm-cov --no-report --doc --workspace --features ci
          mkdir coverage
          cargo +nightly llvm-cov report --doctests --lcov --output-path coverage/lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
